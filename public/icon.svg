<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#0f172a" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#hm-grad)" filter="url(#glow)" />
  
  <!-- Horns -->
  <path d="M140 148 C120 90, 80 84, 88 152 C94 198, 140 200, 140 148 Z" fill="#ffffff" />
  <path d="M372 148 C392 90, 432 84, 424 152 C418 198, 372 200, 372 148 Z" fill="#ffffff" />

  <!-- Happy Face Center -->
  <!-- Left Eye -->
  <ellipse cx="180" cy="225" rx="28" ry="34" fill="#0f172a" />
  <circle cx="188" cy="215" r="10" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="332" cy="225" rx="28" ry="34" fill="#0f172a" />
  <circle cx="340" cy="215" r="10" fill="#ffffff" />

  <!-- Cheerful Big Smile -->
  <path d="M 160 280 C 180 375, 332 375, 352 280 C 330 295, 182 295, 160 280 Z" fill="#0f172a" />
  
  <!-- Smile Tongue / Teeth -->
